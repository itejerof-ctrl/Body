<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BodyTrack">
  <meta name="theme-color" content="#000000">
  <title>BodyTrack iOS - Grasa Corporal e IMC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 48px);
      --safe-bottom: env(safe-area-inset-bottom, 24px);
    }
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overscroll-behavior-y: none;
    }
    .ios-header {
      padding-top: calc(var(--safe-top) + 12px);
      background: rgba(12, 12, 14, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .ios-tabbar {
      padding-bottom: calc(var(--safe-bottom) + 6px);
      background: rgba(18, 18, 20, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .ios-card {
      background-color: #161618;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #2c2c2e;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: pointer;
      border: 2px solid #3b82f6;
    }
    .step-btn:active {
      transform: scale(0.92);
      background-color: #3a3a3c;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-28">

  <!-- CABECERA FIJA CON ESTADO DE GOOGLE SHEETS -->
  <header class="ios-header sticky top-0 z-40 px-4 pb-3 border-b border-white/10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-heart-pulse text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight leading-tight">BodyTrack</h1>
          <p class="text-xs text-zinc-400">Grasa Corporal & IMC</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="switchTab('cloud')" id="cloudStatusBtn" class="px-2.5 py-1.5 rounded-full bg-zinc-800/90 border border-white/10 text-xs font-medium text-emerald-400 flex items-center gap-1.5 active:scale-95 transition">
          <i id="cloudStatusIcon" class="fa-solid fa-cloud-check text-emerald-400"></i>
          <span id="cloudStatusText" class="font-semibold">Sheets</span>
        </button>
        <button onclick="switchTab('history')" class="px-3 py-1.5 rounded-full bg-zinc-800/90 border border-white/10 text-xs font-medium text-zinc-200 flex items-center gap-1.5 active:scale-95 transition">
          <i class="fa-solid fa-clock-rotate-left text-blue-400"></i>
          <span id="headerCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-md w-full mx-auto px-4 pt-3 space-y-3.5 flex-1">

    <!-- PESTAÑA 1: CALCULADORA -->
    <section id="tab-calc" class="space-y-3.5">

      <!-- Selector de Método -->
      <div class="ios-card p-3.5">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Método de cálculo</span>
          <span id="methodPrecisionBadge" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 border border-blue-500/20">
            MÁS PRECISO (±3-4%)
          </span>
        </div>
        <div class="grid
